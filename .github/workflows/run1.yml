name: "um2"

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - '1'
          - '1b'
          - 'LDP'
          - 'LDP2'

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # SETUP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ============================================================
      # INSTALL SYSTEM PACKAGES
      # ============================================================
      - name: Install Google Chrome & Rclone System
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            rclone \
            fuse3

          # ========================================================
          # CEK GOOGLE CHROME
          # ========================================================

          if ! command -v google-chrome >/dev/null 2>&1; then
            echo ""
            echo "Chrome belum tersedia."
            echo "Installing Google Chrome..."
            echo ""

            wget -q \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

            sudo apt-get install -y \
              ./google-chrome-stable_current_amd64.deb
          fi

          # ========================================================
          # HAPUS CHROMEDRIVER BAWAAN
          # ========================================================

          sudo rm -f /usr/bin/chromedriver

          # ========================================================
          # INFORMASI
          # ========================================================

          echo ""
          echo "========================================"
          echo "Chrome Version:"
          echo "========================================"

          google-chrome --version || true

          echo ""
          echo "========================================"
          echo "Rclone Version:"
          echo "========================================"

          rclone version

          echo ""
          echo "========================================"

      # ============================================================
      # INSTALL PYTHON PACKAGES
      # ============================================================
      - name: Install Python Packages
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            selenium \
            selenium-stealth \
            colorama \
            certifi \
            urllib3

      # ============================================================
      # SETUP RCLONE GOOGLE DRIVE
      # ============================================================
      - name: Setup Rclone Google Drive
        shell: bash
        env:
          RAW_GCP_KEY: ${{ secrets.GCP_SA_KEY }}
          RAW_DRIVE_ID: ${{ secrets.DRIVE_FILE_ID }}
        run: |
          set -e

          # ========================================================
          # BUAT CONFIG DIRECTORY
          # ========================================================

          mkdir -p /home/runner/.config/rclone

          echo ""
          echo "========================================"
          echo "Membuat Service Account JSON..."
          echo "========================================"

          # ========================================================
          # SIMPAN SECRET DALAM BASE64
          # ========================================================

          printf '%s' "$RAW_GCP_KEY" \
            | base64 -w 0 \
            > /tmp/sa_b64.txt

          # ========================================================
          # PROSES SERVICE ACCOUNT
          # ========================================================

          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import re
          import sys

          # ==========================================================
          # READ SERVICE ACCOUNT SECRET
          # ==========================================================

          with open(
              "/tmp/sa_b64.txt",
              "r",
              encoding="utf-8"
          ) as f:
              b64_str = f.read().strip()

          if not b64_str:
              print("[!] ERROR: GCP_SA_KEY kosong!")
              sys.exit(1)

          # ==========================================================
          # DECODE BASE64
          # ==========================================================

          try:
              raw_json_bytes = base64.b64decode(
                  b64_str
              )

              raw_json_str = raw_json_bytes.decode(
                  "utf-8"
              )

          except Exception as e:
              print(
                  f"[!] ERROR decode secret: {e}"
              )
              sys.exit(1)

          # ==========================================================
          # PARSE JSON
          # ==========================================================

          try:
              data = json.loads(
                  raw_json_str
              )

          except json.JSONDecodeError:

              try:
                  repaired = raw_json_str.replace(
                      "\\\\n",
                      "\\n"
                  )

                  data = json.loads(
                      repaired
                  )

              except Exception as e:
                  print(
                      "[!] ERROR: GCP_SA_KEY bukan JSON valid!"
                  )

                  print(
                      f"[!] Detail: {e}"
                  )

                  sys.exit(1)

          # ==========================================================
          # VALIDATE SERVICE ACCOUNT
          # ==========================================================

          required_fields = [
              "type",
              "project_id",
              "private_key",
              "client_email"
          ]

          for field in required_fields:

              if field not in data:
                  print(
                      f"[!] ERROR: Field '{field}' tidak ditemukan"
                  )
                  sys.exit(1)

          # ==========================================================
          # CHECK TYPE
          # ==========================================================

          if data.get("type") != "service_account":
              print(
                  "[!] ERROR: JSON bukan Service Account!"
              )
              sys.exit(1)

          # ==========================================================
          # REPAIR PRIVATE KEY NEWLINE
          # ==========================================================

          if "\\n" in data["private_key"]:
              data["private_key"] = data[
                  "private_key"
              ].replace(
                  "\\n",
                  "\n"
              )

          # ==========================================================
          # SAVE SERVICE ACCOUNT
          # ==========================================================

          sa_path = (
              "/home/runner/.config/rclone/sa.json"
          )

          with open(
              sa_path,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  indent=2
              )

          # ==========================================================
          # DRIVE ROOT FOLDER ID
          # ==========================================================

          raw_id = os.environ.get(
              "RAW_DRIVE_ID",
              ""
          ).strip()

          if not raw_id:
              print(
                  "[!] ERROR: DRIVE_FILE_ID kosong!"
              )
              sys.exit(1)

          # ==========================================================
          # SUPPORT DRIVE ID FORMAT
          #
          # 1. ID langsung
          # 2. https://drive.google.com/drive/folders/XXXXX
          # 3. https://drive.google.com/open?id=XXXXX
          # ==========================================================

          if "/folders/" in raw_id:

              clean_id = raw_id.split(
                  "/folders/",
                  1
              )[1]

              clean_id = clean_id.split(
                  "?",
                  1
              )[0]

              clean_id = clean_id.split(
                  "/",
                  1
              )[0]

          elif "id=" in raw_id:

              match = re.search(
                  r"[?&]id=([^&]+)",
                  raw_id
              )

              if match:
                  clean_id = match.group(1)
              else:
                  clean_id = raw_id

          else:

              clean_id = raw_id

              clean_id = clean_id.split(
                  "?",
                  1
              )[0]

              clean_id = clean_id.rstrip("/")

          clean_id = clean_id.strip()

          # ==========================================================
          # VALIDATE DRIVE ID
          # ==========================================================

          if not clean_id:
              print(
                  "[!] ERROR: Tidak bisa membaca DRIVE_FILE_ID!"
              )
              sys.exit(1)

          # ==========================================================
          # CREATE RCLONE CONFIG
          # ==========================================================

          rclone_conf = f"""[gdrive]
          type = drive
          scope = drive
          service_account_file = {sa_path}
          root_folder_id = {clean_id}
          """

          config_path = (
              "/home/runner/.config/rclone/rclone.conf"
          )

          with open(
              config_path,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  rclone_conf
              )

          # ==========================================================
          # INFO
          # ==========================================================

          print(
              "[+] Service Account & Rclone config berhasil dibuat!"
          )

          print(
              f"[+] Project ID   : {data.get('project_id')}"
          )

          print(
              f"[+] Client Email : {data.get('client_email')}"
          )

          print(
              f"[+] Drive Root ID: {clean_id}"
          )

          print(
              "[+] sa.json berhasil dibuat"
          )

          print(
              "[+] rclone.conf berhasil dibuat"
          )
          PYTHON

          # ========================================================
          # SECURITY
          # ========================================================

          chmod 600 \
            /home/runner/.config/rclone/sa.json

          chmod 600 \
            /home/runner/.config/rclone/rclone.conf

          # ========================================================
          # TEST RCLONE
          # ========================================================

          echo ""
          echo "========================================"
          echo "TEST RCLONE CONFIG"
          echo "========================================"

          rclone listremotes

          echo ""
          echo "========================================"
          echo "TEST GOOGLE DRIVE CONNECTION"
          echo "========================================"

          rclone lsd \
            gdrive: \
            --max-depth 1

          echo ""
          echo "[+] Google Drive connection BERHASIL"

      # ============================================================
      # MOUNT GOOGLE DRIVE
      # ============================================================
      - name: Mount Folder SF
        shell: bash
        run: |
          set -e

          # ========================================================
          # BUAT MOUNT DIRECTORY
          # ========================================================

          mkdir -p ./drive_sf

          echo ""
          echo "========================================"
          echo "Mount Google Drive..."
          echo "========================================"

          # ========================================================
          # RCLONE MOUNT
          # ========================================================

          rclone mount \
            gdrive: \
            ./drive_sf \
            --vfs-cache-mode writes \
            --vfs-cache-max-size 2G \
            --dir-cache-time 5m \
            --poll-interval 30s \
            --daemon

          sleep 5

          # ========================================================
          # CHECK MOUNT
          # ========================================================

          echo ""
          echo "========================================"
          echo "CHECK MOUNT"
          echo "========================================"

          if mountpoint -q ./drive_sf; then
            echo "[+] Google Drive berhasil di-mount"
          else
            echo "[!] ERROR: Google Drive gagal di-mount!"
            exit 1
          fi

          # ========================================================
          # LIST FOLDER
          # ========================================================

          echo ""
          echo "Isi folder:"

          ls -lah ./drive_sf

      # ============================================================
      # RUN BOTS IN PARALLEL
      # ============================================================
      - name: Run All Subfolder Bots
        shell: bash
        run: |
          set -e

          # ========================================================
          # BUAT SCRIPT PYTHON SEMENTARA
          # ========================================================

          cat > /tmp/run_bots.py <<'PYTHON'
          import os
          import subprocess
          import sys

          target = os.environ.get(
              "TARGET",
              ""
          )

          target_dir = os.path.join(
              "./drive_sf",
              target
          )

          print("=" * 60)
          print(
              f"TARGET MATRIX : {target}"
          )
          print(
              f"TARGET FOLDER : {target_dir}"
          )
          print("=" * 60)

          # ========================================================
          # CHECK TARGET DIRECTORY
          # ========================================================

          if not os.path.exists(target_dir):
              print(
                  f"[!] ERROR: Folder {target_dir} "
                  "tidak ditemukan di Google Drive!"
              )
              sys.exit(1)

          # ========================================================
          # PROCESS LIST
          # ========================================================

          processes = []

          # ========================================================
          # RUN BOT LOOP
          # ========================================================

          def run_bot_loop(bot_dir):

              cmd = (
                  "while true; do "
                  "python3 sm.py; "
                  "EXIT_CODE=$?; "
                  f'echo "[!] Bot di {bot_dir} berhenti dengan code $EXIT_CODE"; '
                  'echo "[!] Restart dalam 5 detik..."; '
                  "sleep 5; "
                  "done"
              )

              return subprocess.Popen(
                  cmd,
                  shell=True,
                  cwd=bot_dir,
                  executable="/bin/bash",
                  start_new_session=True
              )

          # ========================================================
          # SEARCH sm.py
          # ========================================================

          for root, dirs, files in os.walk(
              target_dir
          ):

              if "sm.py" in files:

                  print(
                      f"==> Menjalankan Bot di: {root}"
                  )

                  processes.append(
                      run_bot_loop(root)
                  )

          # ========================================================
          # CHECK BOT
          # ========================================================

          if not processes:
              print(
                  f"[!] ERROR: Tidak ditemukan sm.py "
                  f"di dalam {target_dir}"
              )
              sys.exit(1)

          # ========================================================
          # INFO
          # ========================================================

          print("")
          print(
              f"[+] Total bot berjalan: "
              f"{len(processes)}"
          )
          print("")

          print(
              "[+] Semua bot sedang berjalan."
          )

          print(
              "[+] Bot akan terus berjalan "
              "sampai workflow dihentikan."
          )

          print("")

          # ========================================================
          # WAIT
          # ========================================================

          try:

              for process in processes:
                  process.wait()

          except KeyboardInterrupt:

              print(
                  "[!] Workflow dihentikan secara manual."
              )

          # ========================================================
          # CLEANUP
          # ========================================================

          print("")
          print(
              "[+] Workflow selesai."
          )
          PYTHON

          # ========================================================
          # JALANKAN SCRIPT BOT
          # ========================================================

          export TARGET="${{ matrix.target }}"

          python3 /tmp/run_bots.py
