name: "um2"

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - '1'
          - '1b'
          - 'LDP'
          - 'LDP2'

    steps:
    # ============================================================
    # CHECKOUT REPOSITORY
    # ============================================================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ============================================================
    # SETUP PYTHON
    # ============================================================
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ============================================================
    # INSTALL SYSTEM PACKAGES
    # ============================================================
    - name: Install Google Chrome & Rclone System
      run: |
        set -e

        sudo apt-get update
        sudo apt-get install -y \
          wget \
          curl \
          rclone \
          fuse3

        if ! command -v google-chrome >/dev/null 2>&1; then
          echo ""
          echo "Chrome belum tersedia. Installing Google Chrome..."
          echo ""
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        fi

        sudo rm -f /usr/bin/chromedriver

        echo "========================================"
        echo "Chrome Version:"
        google-chrome --version || true
        echo "Rclone Version:"
        rclone version
        echo "========================================"

    # ============================================================
    # INSTALL PYTHON PACKAGES
    # ============================================================
    - name: Install Python Packages
      run: |
        set -e

        python -m pip install --upgrade pip
        pip install \
          requests \
          selenium \
          selenium-stealth \
          colorama \
          certifi \
          urllib3

    # ============================================================
    # SETUP RCLONE GOOGLE DRIVE
    # ============================================================
    - name: Setup Rclone Google Drive
      env:
        RAW_GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        RAW_DRIVE_ID: ${{ secrets.DRIVE_FILE_ID }}
      run: |
        set -e

        mkdir -p /home/runner/.config/rclone

        printf '%s' "$RAW_GCP_KEY" | base64 -w 0 > /tmp/sa_b64.txt

        python3 <<'PYTHON'
        import base64
        import json
        import os
        import re
        import sys

        with open("/tmp/sa_b64.txt", "r", encoding="utf-8") as f:
            b64_str = f.read().strip()

        if not b64_str:
            print("[!] ERROR: GCP_SA_KEY kosong!")
            sys.exit(1)

        try:
            raw_json_bytes = base64.b64decode(b64_str)
            raw_json_str = raw_json_bytes.decode("utf-8")
        except Exception as e:
            print(f"[!] ERROR decode secret: {e}")
            sys.exit(1)

        try:
            data = json.loads(raw_json_str)
        except json.JSONDecodeError:
            try:
                repaired = raw_json_str.replace("\\\\n", "\\n")
                data = json.loads(repaired)
            except Exception as e:
                print(f"[!] ERROR: GCP_SA_KEY bukan JSON valid! Detail: {e}")
                sys.exit(1)

        required_fields = ["type", "project_id", "private_key", "client_email"]
        for field in required_fields:
            if field not in data:
                print(f"[!] ERROR: Field '{field}' tidak ditemukan")
                sys.exit(1)

        if data.get("type") != "service_account":
            print("[!] ERROR: JSON bukan Service Account!")
            sys.exit(1)

        if "\\n" in data["private_key"]:
            data["private_key"] = data["private_key"].replace("\\n", "\n")

        sa_path = "/home/runner/.config/rclone/sa.json"
        with open(sa_path, "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)

        raw_id = os.environ.get("RAW_DRIVE_ID", "").strip()
        if not raw_id:
            print("[!] ERROR: DRIVE_FILE_ID kosong!")
            sys.exit(1)

        if "/folders/" in raw_id:
            clean_id = raw_id.split("/folders/", 1)[1].split("?", 1)[0].split("/", 1)[0]
        elif "id=" in raw_id:
            match = re.search(r"[?&]id=([^&]+)", raw_id)
            clean_id = match.group(1) if match else raw_id
        else:
            clean_id = raw_id.split("?", 1)[0].rstrip("/")

        clean_id = clean_id.strip()
        if not clean_id:
            print("[!] ERROR: Tidak bisa membaca DRIVE_FILE_ID!")
            sys.exit(1)

        rclone_conf = f"""[gdrive]
type = drive
scope = drive
service_account_file = {sa_path}
root_folder_id = {clean_id}
"""

        config_path = "/home/runner/.config/rclone/rclone.conf"
        with open(config_path, "w", encoding="utf-8") as f:
            f.write(rclone_conf)

        print("[+] Service Account & Rclone config berhasil dibuat!")
        PYTHON

        chmod 600 /home/runner/.config/rclone/sa.json
        chmod 600 /home/runner/.config/rclone/rclone.conf

        rclone listremotes
        rclone lsd gdrive: --max-depth 1
        echo "[+] Google Drive connection BERHASIL"

    # ============================================================
    # MOUNT GOOGLE DRIVE
    # ============================================================
    - name: Mount Folder SF
      run: |
        set -e

        mkdir -p ./drive_sf

        rclone mount \
          gdrive: \
          ./drive_sf \
          --vfs-cache-mode writes \
          --vfs-cache-max-size 2G \
          --dir-cache-time 5m \
          --poll-interval 30s \
          --daemon

        sleep 5

        if mountpoint -q ./drive_sf; then
          echo "[+] Google Drive berhasil di-mount"
        else
          echo "[!] ERROR: Google Drive gagal di-mount!"
          exit 1
        fi

        ls -lah ./drive_sf

    # ============================================================
    # RUN BOTS IN PARALLEL
    # ============================================================
    - name: Run All Subfolder Bots
      env:
        TARGET_MATRIX: ${{ matrix.target }}
      run: |
        python3 <<'PYTHON'
        import os
        import subprocess
        import sys

        target = os.environ.get("TARGET_MATRIX", "")
        target_dir = os.path.join("./drive_sf", target)

        print("=" * 60)
        print("TARGET MATRIX :", target)
        print("TARGET FOLDER :", target_dir)
        print("=" * 60)

        if not os.path.exists(target_dir):
            print("[!] ERROR: Folder %s tidak ditemukan di Google Drive!" % target_dir)
            sys.exit(1)

        processes = []

        def run_bot_loop(bot_dir):
            cmd = "while true; do python3 sm.py; echo '[!] Bot berhenti, restart 5s...'; sleep 5; done"
            return subprocess.Popen(
                cmd,
                shell=True,
                cwd=bot_dir,
                executable="/bin/bash",
                start_new_session=True
            )

        for root, dirs, files in os.walk(target_dir):
            if "sm.py" in files:
                print("==> Menjalankan Bot di:", root)
                processes.append(run_bot_loop(root))

        if not processes:
            print("[!] ERROR: Tidak ditemukan sm.py di dalam %s" % target_dir)
            sys.exit(1)

        print("\n[+] Total bot berjalan:", len(processes), "\n")

        try:
            for p in processes:
                p.wait()
        except KeyboardInterrupt:
            print("[!] Workflow dihentikan secara manual.")
        PYTHON
